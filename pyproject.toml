[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "compliance-copilot"
version = "0.1.0"
description = "Local RAG assistant answering GDPR and AI Act questions in French, always citing the source article."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# Dependencies are pinned in requirements.txt.

[project.optional-dependencies]
# Optional cross-encoder reranker (SEARCH_RERANK=on, off by default; eval/results_v4.md, section 7):
#   .venv\Scripts\python -m pip install -e .[rerank]
# On Windows the PyPI build of torch is CPU-only. Elsewhere, add --extra-index-url https://download.pytorch.org/whl/cpu
# to avoid the much larger CUDA build.
rerank = [
    "torch==2.15.0",
    "transformers==5.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
